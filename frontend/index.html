<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Kaam</h1>
      <p class="tagline">Speak your skills. Get hired.</p>
    </header>

    <!-- 1. Pick a language and consent -->
    <section id="screen-welcome" class="screen">
      <h2>Choose a language</h2>
      <div id="languages" class="languages"></div>
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>I agree to answer a few questions by voice. My answers become a resume I control. Audio is not stored.</span>
      </label>
      <button id="start" class="primary big" disabled>Start</button>
      <p id="welcome-error" class="error" hidden></p>
    </section>

    <!-- 2. The interview -->
    <section id="screen-interview" class="screen" hidden>
      <div class="progress"><div id="progress-bar"></div></div>
      <p id="progress-label" class="muted"></p>
      <p id="question" class="question"></p>
      <button id="replay" class="link">Hear the question again</button>

      <div class="mic-row">
        <span id="mic-dot" class="mic-dot"></span>
        <span id="mic-status" class="muted">Getting ready…</span>
      </div>
      <textarea id="answer" rows="5" placeholder="Your answer appears here as you speak. You can fix mistakes by typing."></textarea>

      <div class="row">
        <button id="rerecord">Say it again</button>
        <button id="next" class="primary">Next</button>
      </div>
    </section>

    <!-- 3. Review -->
    <section id="screen-done" class="screen" hidden>
      <h2>Your answers</h2>
      <ol id="review" class="review"></ol>
      <p id="saved" class="muted"></p>
      <button id="restart">Start over</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
