<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Kavach</h1>
      <p class="tagline">Live scam-call shield</p>
    </header>

    <section class="panel">
      <div class="row">
        <button id="listen" class="primary">Start listening</button>
        <span id="status" class="status">Idle</span>
      </div>
      <p class="hint">Put the call on speaker and keep this device close to it.</p>
      <ol id="transcript" class="transcript"></ol>
    </section>

    <section class="panel">
      <h2>Voice test</h2>
      <div class="row">
        <select id="tts-lang">
          <option value="hi-IN">Hindi</option>
          <option value="hi-en">Hinglish</option>
          <option value="en-IN">English</option>
          <option value="ta-IN">Tamil</option>
          <option value="te-IN">Telugu</option>
          <option value="kn-IN">Kannada</option>
          <option value="ml-IN">Malayalam</option>
          <option value="mr-IN">Marathi</option>
          <option value="bn-IN">Bengali</option>
          <option value="gu-IN">Gujarati</option>
          <option value="pa-IN">Punjabi</option>
        </select>
        <button id="speak">Speak</button>
      </div>
      <textarea id="tts-text" rows="2">रुकिए! यह कॉल धोखा है। फ़ोन काट दीजिए और किसी को ओटीपी मत बताइए।</textarea>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
